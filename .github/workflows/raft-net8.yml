name: Raft .NET 8 validation

on:
  push:
    paths: ['RaftNet8/**', '_docs/**', 'AGENTS.md', '.github/workflows/raft-net8.yml']
  pull_request:
    paths: ['RaftNet8/**', '_docs/**', 'AGENTS.md', '.github/workflows/raft-net8.yml']
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      deep_simulation:
        description: Run 3000 seeds per scenario and topology
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: raft-net8-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: RaftNet8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Raft.Net8.sln --locked-mode
      - run: dotnet build Raft.Net8.sln -c Release --no-restore
      - name: Unit, property, TCP, disk and real process crash tests with core coverage
        run: dotnet test tests/Raft.Tests -c Release --no-build --no-restore --settings tests/core-coverage.runsettings --collect "Code Coverage;Format=Cobertura" --logger trx --results-directory .artifacts/ci/tests
      - name: Human demonstration scenario
        run: dotnet run --project HumanTest/Raft.Demo -c Release --no-build -- --scenario
      - name: PR simulation matrix (896 seeds/scenarios/topologies)
        run: dotnet run --project tools/Raft.Simulator -c Release --no-build -- --seeds 64 --scenario all --steps 3000 --voters 3,5 --parallel 2 --out .artifacts/ci/simulation-small.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raft-validation-${{ matrix.os }}
          path: RaftNet8/.artifacts/ci/
          include-hidden-files: true
          retention-days: 14

  nightly-simulation:
    if: github.event_name == 'schedule' || inputs.deep_simulation == true
    strategy:
      fail-fast: false
      matrix:
        scenario: [Elections, Partitions, CrashRecovery, Reads, Membership, Snapshots, Mixed]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: RaftNet8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore tools/Raft.Simulator/Raft.Simulator.csproj --locked-mode
      - run: dotnet build tools/Raft.Simulator/Raft.Simulator.csproj -c Release --no-restore
      - run: dotnet run --project tools/Raft.Simulator -c Release --no-build -- --seeds 3000 --scenario ${{ matrix.scenario }} --steps 3000 --voters 3,5 --parallel 2 --out .artifacts/ci/nightly-${{ matrix.scenario }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raft-nightly-${{ matrix.scenario }}
          path: RaftNet8/.artifacts/ci/
          include-hidden-files: true
          retention-days: 14
